<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Portfolio</title>
    <link rel="stylesheet" href="./styles.css">
    <script>
      window.PORTFOLIO_APP_CONFIG = {
        apiBaseUrl: "https://script.google.com/macros/s/AKfycbyZzzxm1NZbM7ybKyt1gYhTrKKyHi1sf6F3pd_fXLnfDiiWZQa6yosKwPgf8No5fKU5/exec",
        liffId: "2010108717-qrydg64H"
      };
    </script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">LINE Mini App</div>
          <h1>Portfolio</h1>
        </div>
        <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh">↻</button>
      </header>

      <section class="hero-metrics" id="heroMetrics"></section>

      <section class="chart-card">
        <div class="chart-head">
          <div>
            <h2>Asset Trend</h2>
            <div id="chartMeta" class="chart-meta">Loading...</div>
          </div>
          <div class="toggle-group" aria-label="Chart controls">
            <div class="toggle-label">Metric</div>
            <div class="metric-toggle" role="tablist" aria-label="Metric">
              <button class="metric-btn is-active" data-metric="asset" type="button">Total Asset</button>
              <button class="metric-btn" data-metric="gain" type="button">Gain</button>
              <button class="metric-btn" data-metric="cash" type="button">Cash</button>
              <button class="metric-btn" data-metric="holdings" type="button">Holdings Value</button>
              <button class="metric-btn" data-metric="gainRate" type="button">Gain Rate</button>
            </div>
            <div class="toggle-label">Range</div>
            <div class="range-toggle" role="tablist" aria-label="Range">
              <button class="range-btn is-active" data-range="7" type="button">7d</button>
              <button class="range-btn" data-range="30" type="button">30d</button>
              <button class="range-btn" data-range="90" type="button">90d</button>
              <button class="range-btn" data-range="180" type="button">180d</button>
              <button class="range-btn" data-range="all" type="button">All</button>
            </div>
          </div>
        </div>
        <div id="chartSummary" class="chart-summary"></div>
        <div id="chartLegend" class="chart-legend"></div>
        <div id="chartContainer" class="chart-container"></div>
      </section>

      <section class="alert-card">
        <div class="section-head">
          <h2>Alerts</h2>
        </div>
        <div id="alertList" class="stack-list"></div>
      </section>

      <nav class="tabbar" aria-label="sections">
        <button class="tab is-active" data-tab="home" type="button">Home</button>
        <button class="tab" data-tab="holdings" type="button">Holdings</button>
        <button class="tab" data-tab="watchlist" type="button">Watch</button>
        <button class="tab" data-tab="weekly" type="button">Weekly</button>
      </nav>

      <main>
        <section class="panel is-active" data-panel="home">
          <div class="section-card">
            <h2>Status</h2>
            <div id="homeSummary" class="summary-list"></div>
          </div>
        </section>

        <section class="panel" data-panel="holdings">
          <div class="section-card">
            <h2>Current Holdings</h2>
            <div id="holdingsList" class="stack-list"></div>
          </div>
        </section>

        <section class="panel" data-panel="watchlist">
          <div class="section-card">
            <h2>Watchlist</h2>
            <div id="watchlistList" class="stack-list"></div>
          </div>
        </section>

        <section class="panel" data-panel="weekly">
          <div class="section-card">
            <h2>Weekly Review</h2>
            <div id="weeklySummary" class="summary-list"></div>

            <div class="subsection">
              <h3>Themes</h3>
              <div id="themeList" class="stack-list"></div>
            </div>

            <div class="subsection">
              <h3>Candidates</h3>
              <div id="candidateList" class="stack-list"></div>
            </div>

            <div class="subsection">
              <h3>Budgeted</h3>
              <div id="budgetList" class="stack-list"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
