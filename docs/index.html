<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>株ポートフォリオ</title>
    <link rel="stylesheet" href="./styles.css">
    <script>
      window.PORTFOLIO_APP_CONFIG = {
        apiBaseUrl: "https://script.google.com/macros/s/AKfycbyZzzxm1NZbM7ybKyt1gYhTrKKyHi1sf6F3pd_fXLnfDiiWZQa6yosKwPgf8No5fKU5/exec",
        liffId: "2010108717-qrydg64H"
      };
    </script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">LINE Mini App</div>
          <h1>株ポートフォリオ</h1>
        </div>
        <button id="refreshButton" class="icon-button" type="button" aria-label="更新">↻</button>
      </header>

      <section class="hero-metrics" id="heroMetrics"></section>

      <section class="chart-card">
        <div class="chart-head">
          <div>
            <h2>資産推移</h2>
            <div id="chartMeta" class="chart-meta">読み込み中</div>
          </div>
          <div class="toggle-group" aria-label="グラフ操作">
            <div class="toggle-label">項目</div>
            <div class="metric-toggle" role="tablist" aria-label="項目">
              <button class="metric-btn is-active" data-metric="asset" type="button">総資産</button>
              <button class="metric-btn" data-metric="gain" type="button">損益</button>
              <button class="metric-btn" data-metric="cash" type="button">現金</button>
              <button class="metric-btn" data-metric="holdings" type="button">保有評価</button>
              <button class="metric-btn" data-metric="gainRate" type="button">損益率</button>
            </div>
            <div class="toggle-label">期間</div>
            <div class="range-toggle" role="tablist" aria-label="期間">
              <button class="range-btn is-active" data-range="7" type="button">7日</button>
              <button class="range-btn" data-range="30" type="button">30日</button>
              <button class="range-btn" data-range="90" type="button">90日</button>
              <button class="range-btn" data-range="180" type="button">180日</button>
              <button class="range-btn" data-range="all" type="button">全部</button>
            </div>
          </div>
        </div>
        <div id="chartSummary" class="chart-summary"></div>
        <div id="chartLegend" class="chart-legend"></div>
        <div id="chartContainer" class="chart-container"></div>
      </section>

      <section class="alert-card">
        <div class="section-head">
          <h2>アラート</h2>
        </div>
        <div id="alertList" class="stack-list"></div>
      </section>

      <nav class="tabbar" aria-label="sections">
        <button class="tab is-active" data-tab="home" type="button">ホーム</button>
        <button class="tab" data-tab="holdings" type="button">保有</button>
        <button class="tab" data-tab="watchlist" type="button">監視</button>
        <button class="tab" data-tab="weekly" type="button">週次</button>
      </nav>

      <main>
        <section class="panel is-active" data-panel="home">
          <div class="section-card">
            <h2>いまの状況</h2>
            <div id="homeSummary" class="summary-list"></div>
          </div>
        </section>

        <section class="panel" data-panel="holdings">
          <div class="section-card">
            <h2>現在保有</h2>
            <div id="holdingsList" class="stack-list"></div>
          </div>
        </section>

        <section class="panel" data-panel="watchlist">
          <div class="section-card">
            <h2>監視銘柄</h2>
            <div id="watchlistList" class="stack-list"></div>
          </div>
        </section>

        <section class="panel" data-panel="weekly">
          <div class="section-card">
            <h2>週次レビュー</h2>
            <div id="weeklySummary" class="summary-list"></div>

            <div class="subsection">
              <h3>テーマ別</h3>
              <div id="themeList" class="stack-list"></div>
            </div>

            <div class="subsection">
              <h3>候補</h3>
              <div id="candidateList" class="stack-list"></div>
            </div>

            <div class="subsection">
              <h3>目標買付額あり</h3>
              <div id="budgetList" class="stack-list"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
